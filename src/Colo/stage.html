<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Palco</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --ink: #141416; --muted: #8a8a93; --line: rgba(20,20,22,.08); --chip: rgba(20,20,22,.05); --chip-h: rgba(20,20,22,.09);
    --accent: #2563eb; --accent-soft: rgba(37,99,235,.14);
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --text: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e11; --ink: #f2f2f4; --muted: #8d8d97; --line: rgba(255,255,255,.08); --chip: rgba(255,255,255,.06); --chip-h: rgba(255,255,255,.11);
      --accent: #6aa3ff; --accent-soft: rgba(106,163,255,.16); }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* lo creado */
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent;
    opacity: 0; transform: scale(.985); transition: opacity .5s var(--ease), transform .7s var(--ease); }
  iframe.on { opacity: 1; transform: none; }

  /* barra: aparece al acercarse arriba */
  .bar { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 14px; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); cursor: default; user-select: none; }
  .bar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(var(--bg) 30%, transparent); opacity: .92; }
  .bar.show { opacity: 1; pointer-events: auto; }
  /* franja fina arriba: al acercarse aparece la barra, sin tapar lo creado */
  .hot { position: absolute; z-index: 7; top: 0; left: 0; right: 0; height: 8px; }
  .bar .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12.5px; }
  .bar .title b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .bar button { width: 28px; height: 28px; border: 0; border-radius: 9px; background: var(--chip); color: var(--ink); display: grid; place-items: center; cursor: pointer;
    transition: background .15s, transform .15s var(--ease); }
  .bar button:hover { background: var(--chip-h); }
  .bar button:active { transform: scale(.92); }
  .bar svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* creando */
  .making { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; transition: opacity .35s var(--ease); }
  .making.off { opacity: 0; pointer-events: none; }
  .making .box { max-width: 460px; width: 100%; }
  .orb { width: 64px; height: 64px; margin-bottom: 28px; }
  .orb circle { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; transform-origin: 32px 32px; }
  .orb .a { stroke-dasharray: 60 140; animation: spin 2.4s linear infinite; }
  .orb .b { stroke-dasharray: 30 120; opacity: .55; animation: spin 3.6s linear infinite reverse; }
  .orb .c { fill: var(--accent); stroke: none; animation: breathe 2.4s var(--ease) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(.7); opacity: .55; } 50% { transform: scale(1); opacity: 1; } }
  .making h1 { font: 600 30px/1.12 var(--display); letter-spacing: -.025em; margin: 0 0 10px; text-wrap: balance;
    animation: rise .7s var(--ease) both; }
  .making p { color: var(--muted); font-size: 15px; margin: 0; text-wrap: pretty; animation: rise .7s .08s var(--ease) both; }
  .making .status { margin-top: 26px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums;
    animation: rise .7s .16s var(--ease) both; }
  .making .track { flex: 1; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .making .track i { display: block; height: 100%; width: 30%; border-radius: 2px; background: var(--accent); animation: slide 1.6s var(--ease) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .making.failed .orb, .making.failed .track { display: none; }
  .making .retry { display: none; margin-top: 22px; }
  .making.failed .retry { display: inline-flex; }
  .btn { font: 600 13px var(--text); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--chip); color: var(--ink); }

  /* cambiando la pieza que se ve: pastilla discreta abajo, la pieza sigue a la vista */
  .editing { position: absolute; z-index: 6; left: 50%; bottom: 16px; transform: translate(-50%, 12px); display: flex; align-items: center; gap: 9px;
    max-width: calc(100% - 32px); padding: 8px 14px 8px 12px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,.14); color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums;
    opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .35s var(--ease); }
  .editing.on { opacity: 1; transform: translate(-50%, 0); }
  .editing span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .editing i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; animation: breathe 1.6s var(--ease) infinite; }

  /* pregunta de vuelta: solo con clic */
  .ask { position: absolute; z-index: 6; left: 50%; bottom: 18px; transform: translate(-50%, 20px); width: min(560px, calc(100% - 28px));
    display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 16px;
    background: var(--bg); border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .3s var(--ease), transform .45s var(--ease); }
  .ask.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .ask p { flex: 1; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask small { display: block; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<iframe id="frame" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation allow-pointer-lock"
  allow="autoplay; fullscreen; picture-in-picture; encrypted-media" title="Palco"></iframe>

<div class="making off" id="making">
  <div class="box">
    <svg class="orb" viewBox="0 0 64 64"><circle class="a" cx="32" cy="32" r="28"/><circle class="b" cx="32" cy="32" r="20"/><circle class="c" cx="32" cy="32" r="6"/></svg>
    <h1 id="mTitle"></h1>
    <p id="mBrief"></p>
    <div class="status"><div class="track"><i></i></div><span id="mStatus">Pensando…</span></div>
    <button class="btn retry" id="retry">Intentar de nuevo</button>
  </div>
</div>

<div class="hot" id="hot"></div>
<div class="bar" id="bar">
  <div class="title" id="title"><b>Colo</b></div>
  <button id="big" title="Más grande"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
  <button id="close" title="Cerrar (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="editing" id="editing"><i></i><span id="editingText"></span></div>

<div class="ask" id="ask"><p><small>Preguntar a Colo</small><span id="askText"></span></p><button class="btn ghost" id="askNo">No</button><button class="btn" id="askGo">Preguntar</button></div>

<script>
const PALCO = "https://palco.colo";
const $ = s => document.querySelector(s);
const frame = $("#frame"), making = $("#making");
const send = m => window.chrome?.webview?.postMessage(m);
let pending = "", t0 = 0, chars = 0, tick = null;

function setTitle(t) { $("#title").innerHTML = "<b>Colo</b>"; $("#title").append(document.createTextNode(t || "")); }
function status() {
  const s = Math.round((Date.now() - t0) / 1000);
  $("#mStatus").textContent = chars > 0 ? `Diseñando · ${(chars / 1000).toFixed(1).replace(".", ",")} mil caracteres · ${s} s` : `Pensando · ${s} s`;
}

// Colo → host
window.chrome?.webview?.addEventListener("message", e => {
  const m = e.data;
  if (m.type === "loading") {
    $("#ask").classList.remove("on");
    frame.classList.remove("on");
    making.classList.remove("off", "failed");
    $("#mTitle").textContent = m.title || "Creando";
    $("#mBrief").textContent = m.brief || "";
    setTitle(m.title);
    t0 = Date.now(); chars = 0; status();
    bar.classList.add("show");
    clearInterval(tick); tick = setInterval(status, 500);
  } else if (m.type === "progress") {
    chars = m.chars || 0;
    if (m.note) $("#mStatus").textContent = m.note;
  } else if (m.type === "show") {
    frame.classList.remove("on");
    setTitle(m.title);
    frame.src = m.src;
  } else if (m.type === "editing") {
    if (m.text) $("#editingText").textContent = m.text;
    $("#editing").classList.toggle("on", !!m.text);
  } else if (m.type === "failed") {
    clearInterval(tick);
    making.classList.remove("off");
    making.classList.add("failed");
    bar.classList.add("show");
    $("#mStatus").textContent = m.text || "No salió.";
    frame.classList.remove("on");
  }
});
frame.addEventListener("load", () => {
  if (!frame.src) return;
  clearInterval(tick);
  making.classList.add("off");
  requestAnimationFrame(() => frame.classList.add("on"));
  bar.classList.add("show"); laterBar();
});

// La página → host: solo lo que llega del iframe del palco.
addEventListener("message", e => {
  if (e.source !== frame.contentWindow || e.origin !== PALCO || !e.data || e.data.colo !== 1) return;
  const m = e.data;
  if (m.type === "rendered") send({ type: "rendered", errors: (m.errors || []).slice(0, 6).map(String), blank: !!m.blank });
  else if (m.type === "say") send({ type: "say", text: String(m.text || "").slice(0, 600) });
  else if (m.type === "open" && /^https:\/\//.test(m.url || "")) send({ type: "open", url: m.url });
  else if (m.type === "ask" && m.text) { pending = String(m.text).slice(0, 500); $("#askText").textContent = pending; $("#ask").classList.add("on"); }
});

$("#askGo").onclick = () => { send({ type: "ask", text: pending }); $("#ask").classList.remove("on"); };
$("#askNo").onclick = () => $("#ask").classList.remove("on");
$("#retry").onclick = () => send({ type: "retry" });
$("#close").onclick = () => send({ type: "close" });
$("#big").onclick = () => send({ type: "big" });
const bar = $("#bar");
let hideBar = null;
const showBar = () => { clearTimeout(hideBar); bar.classList.add("show"); };
const laterBar = () => { clearTimeout(hideBar); if (making.classList.contains("off")) hideBar = setTimeout(() => bar.classList.remove("show"), 900); };
$("#hot").addEventListener("mouseenter", showBar);
bar.addEventListener("mouseenter", showBar);
bar.addEventListener("mouseleave", laterBar);
// Arrastrar la ventana desde la barra; doble clic = más grande o normal.
$("#bar").addEventListener("mousedown", e => { if (e.button === 0 && !e.target.closest("button")) send({ type: "drag" }); });
$("#bar").addEventListener("dblclick", e => { if (!e.target.closest("button")) send({ type: "big" }); });
addEventListener("keydown", e => { if (e.key === "Escape") send({ type: "close" }); });
send({ type: "ready" });
</script>
</body>
</html>
