<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Palco</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #111113; --muted: #84848c; --line: #e7e7ea; --fill: #f4f4f5; --blue: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --ink: #f4f4f5; --muted: #9a9aa3; --line: #2c2c31; --fill: #1d1d20; --blue: #60a5fa; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); opacity: 0; transition: opacity .25s ease; }
  iframe.on { opacity: 1; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .wait span { display: inline-flex; gap: 6px; align-items: center; }
  .wait i { width: 6px; height: 6px; border-radius: 99px; background: var(--blue); animation: b 1s infinite ease-in-out; }
  .wait i:nth-child(2) { animation-delay: .15s; } .wait i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .ask { position: absolute; left: 14px; right: 14px; bottom: 14px; display: none; align-items: center; gap: 10px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
  .ask.on { display: flex; animation: up .25s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes up { from { transform: translateY(12px); opacity: 0; } }
  .ask p { flex: 1; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ask small { color: var(--muted); display: block; font-size: 12px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 7px 13px; cursor: pointer; background: var(--fill); color: var(--ink); }
  button.go { background: var(--blue); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="wait" id="wait"><span><i></i><i></i><i></i></span></div>
<iframe id="frame" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation allow-pointer-lock"
  allow="autoplay; fullscreen; picture-in-picture; encrypted-media" title="Palco"></iframe>
<div class="ask" id="ask"><p><small>Preguntar a Colo</small><span id="askText"></span></p><button id="askNo">✕</button><button class="go" id="askGo">Preguntar</button></div>
<script>
const PALCO = "https://palco.colo";
const $ = s => document.querySelector(s);
const frame = $("#frame");
const send = m => window.chrome?.webview?.postMessage(m);
let pending = "";

// Colo → host: muestra una página del palco.
window.chrome?.webview?.addEventListener("message", e => {
  const m = e.data;
  if (m.type === "show") {
    $("#ask").classList.remove("on");
    frame.classList.remove("on");
    $("#wait").style.display = "";
    frame.src = m.src;
  }
});
frame.addEventListener("load", () => { if (frame.src) { frame.classList.add("on"); $("#wait").style.display = "none"; } });

// La página → host: solo lo que llega del iframe del palco.
addEventListener("message", e => {
  if (e.source !== frame.contentWindow || e.origin !== PALCO || !e.data || e.data.colo !== 1) return;
  const m = e.data;
  if (m.type === "rendered") send({ type: "rendered", errors: (m.errors || []).slice(0, 6).map(String), ran: !!m.ran, blank: !!m.blank });
  else if (m.type === "say") send({ type: "say", text: String(m.text || "").slice(0, 600) });
  else if (m.type === "open" && /^https:\/\//.test(m.url || "")) send({ type: "open", url: m.url });
  // Una pregunta de vuelta al modelo solo sale si la persona la confirma aquí.
  else if (m.type === "ask" && m.text) { pending = String(m.text).slice(0, 500); $("#askText").textContent = pending; $("#ask").classList.add("on"); }
});
$("#askGo").onclick = () => { send({ type: "ask", text: pending }); $("#ask").classList.remove("on"); };
$("#askNo").onclick = () => $("#ask").classList.remove("on");
addEventListener("keydown", e => { if (e.key === "Escape") send({ type: "close" }); });
send({ type: "ready" });
</script>
</body>
</html>
