name: Release

# Al subir una etiqueta vX.Y.Z: Colo.exe + instalador (Inno Setup, por usuario, sin admin) en una release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Colo.exe
        run: dotnet publish src/Colo -c Release -o out

      - name: Whisper base dentro del instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/models/whisper | Out-Null
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin -OutFile out/models/whisper/ggml-base-q5_1.bin
          if ((Get-Item out/models/whisper/ggml-base-q5_1.bin).Length -ne 59707625) { throw "modelo incompleto" }

      - name: Instalador
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" | Select-Object -First 1 }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc.FullName "/DAppVersion=$version" "/DSourceDir=..\out" installer\Colo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out\ColoSetup-*.exe

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" "out/ColoSetup-$version.exe" out/Colo.exe `
            --title "Colo $version" `
            --notes "Descarga **ColoSetup-$version.exe** y ábrelo: se instala solo para tu usuario (sin pedir administrador), crea el acceso en el menú Inicio y ya trae la voz (Whisper base). También está Colo.exe suelto, sin instalar."
